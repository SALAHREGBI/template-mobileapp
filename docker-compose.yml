services:
  postgres:
    image: postgis/postgis:17-3.5-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: daba_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-regbi}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-daba_redis_secret}"]
    ports:
      - "6380:6379"
    networks:
      - app-network

  backend:
    build:
      context: ./backend/daba
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      COMPILE_POLL_SECONDS: "2"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/daba_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-regbi}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-daba_redis_secret}
      SPRING_CACHE_TYPE: redis
      DABA_JWT_SECRET: ${DABA_JWT_SECRET:?Set DABA_JWT_SECRET in your .env (see .env.example)}
      DABA_JWT_ISSUER: ${DABA_JWT_ISSUER:-daba-api}
      DABA_JWT_ACCESS_TTL: ${DABA_JWT_ACCESS_TTL:-P1D}
    ports:
      - "8080:8080"
    volumes:
      - ./backend/daba:/app
      - backend_maven_repo:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/mobile-app
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    env_file:
      - .env
    environment:
      LAN_HOST: ${LAN_HOST:-}
      EXPO_PUBLIC_API_BASE_URL: ${EXPO_PUBLIC_API_BASE_URL:-}
      EXPO_TUNNEL: ${EXPO_TUNNEL:-0}
      METRO_USE_POLLING: "1"
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      - ./frontend/mobile-app:/app
      - frontend_node_modules:/app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  backend_maven_repo:
  frontend_node_modules:
