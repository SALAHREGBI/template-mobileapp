###############################################################################
# Full-stack boilerplate — inject secrets via environment / .env (never commit real prod values).
###############################################################################
spring:
  application:
    name: daba-api
  docker:
    compose:
      enabled: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/daba_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: DabaHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          lob:
            non_contextual_creation: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1

  cache:
    type: redis

  websocket:
    message-broker:
      relay-host: ${SPRING_WEBSOCKET_RELAY_HOST:localhost}
      relay-port: ${SPRING_WEBSOCKET_RELAY_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

daba:
  jwt:
    secret: ${DABA_JWT_SECRET:}
    issuer: ${DABA_JWT_ISSUER:daba-api}
    access-token-ttl: ${DABA_JWT_ACCESS_TTL:P1D}

  cache:
    default-ttl: ${DABA_CACHE_DEFAULT_TTL:600s}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    ma.daba: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level %logger{36} — %msg%n"
